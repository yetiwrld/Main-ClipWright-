name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # corepack reads packageManager from package.json (pnpm@9.15.9) — the same
      # pattern that the repository's other CI workflow uses successfully.
      - run: corepack enable

      - name: Install (VS env)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # pnpm's bundled node-gyp (v10) cannot detect VS 2026; install a
          # node-gyp that can (>=12.1.0) and point pnpm at it.
          npm install -g node-gyp@13 --no-audit --no-fund | Out-Null
          $ng = Join-Path (npm root -g) 'node-gyp\bin\node-gyp.js'
          Write-Host "node-gyp: $ng"
          $env:npm_config_node_gyp = $ng
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "Visual Studio: $vsPath"
          cmd /c "call `"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && pnpm install --frozen-lockfile --fetch-retries 5 > install.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            $raw = [IO.File]::ReadAllText('install.log')
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($raw))
            if ($b64.Length -gt 3000) { $b64 = $b64.Substring($b64.Length - 3000) }
            Write-Host "::error::pnpm install failed (exit $LASTEXITCODE) log(base64 tail):$b64"
            exit $LASTEXITCODE
          }
        env:
          # The Electron npm postinstall downloads ~110 MB from the release CDN,
          # which has flaked on these runners before. CI never launches Electron;
          # electron-builder fetches its own dist when packaging.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (per package)
        shell: bash
        run: |
          set -o pipefail
          failed=0
          for pkg in design-system audio-core project-schema timeline-engine media-core caption-styles ai-core export-core; do
            (cd "packages/$pkg" && pnpm test) || failed=1
          done
          (cd apps/desktop && pnpm test) || failed=1
          exit $failed

      # ---- bundled binaries (unpinned sources, see docs/release.md) ----
      - name: Fetch FFmpeg (BtbN GPL build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $binDir = Join-Path $PWD 'apps/desktop/resources/bin'
          Copy-Item (Get-ChildItem ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName $binDir/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg-extract -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName $binDir/ffprobe.exe

      - name: Fetch yt-dlp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile apps/desktop/resources/bin/yt-dlp.exe

      - name: Fetch & build whisper.cpp (pinned tag)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch v1.9.5 https://github.com/ggerganov/whisper.cpp whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build --config Release
          $exe = Get-ChildItem whisper.cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem whisper.cpp/build -Recurse -Filter main.exe | Select-Object -First 1 }
          if (-not $exe) { throw 'whisper-cli.exe not produced' }
          Copy-Item $exe.FullName apps/desktop/resources/bin/whisper-cli.exe

      - name: Record sha256 checksums
        run: node scripts/release/gen-checksums.mjs

      - name: Build & package (NSIS + portable, x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "Visual Studio: $vsPath"
          cmd /c "call `"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && pnpm --filter @clipwright/desktop dist > dist.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            $raw = [IO.File]::ReadAllText('dist.log')
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($raw))
            if ($b64.Length -gt 3000) { $b64 = $b64.Substring($b64.Length - 3000) }
            Write-Host "::error::packaging failed (exit $LASTEXITCODE) log(base64 tail):$b64"
            exit $LASTEXITCODE
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Print artefact hashes
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "$h  $($_.Name)  ($($_.Length) bytes)"
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $setup = Get-ChildItem apps/desktop/release -Filter '*Setup*.exe' | Select-Object -First 1
          $portable = Get-ChildItem apps/desktop/release -Filter '*portable*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS artefact not found' }
          $sumSetup = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumPortable = if ($portable) { (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } else { 'n/a' }
          $notes = @"
          Clipwright Studio $tag

          **Unsigned build.** Windows SmartScreen will warn that the publisher is unknown.
          Verify the SHA-256 hashes below before running.

          - Setup:   $sumSetup  $($setup.Name)
          - Portable: $sumPortable  $(if ($portable) { $portable.Name } else { 'not produced' })

          FFmpeg is a separate GPL executable (BtbN GPL build, see docs/licences.md);
          corresponding source is offered there and in the release notes of this tag.
          "@
          $notes | Out-File release-notes.md -Encoding utf8
          gh release create $tag "$($setup.FullName)" $(if ($portable) { "$($portable.FullName)" }) --title "Clipwright Studio $tag" --notes-file release-notes.md
