name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.x'

      - name: Enable Corepack & pnpm
        run: corepack enable

      # The lockfile is committed; installing against it is what makes "passes
      # locally" mean something in CI. Without --frozen-lockfile, CI resolves
      # versions the developer never ran, and a red build says nothing about the
      # code that was pushed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same script a developer runs locally — lint, typecheck, tests, build
      # and the repository check, in that order. Keeping one definition means CI
      # cannot drift from what was actually verified, and the build step cannot
      # be the one everybody forgets: it was, and it was broken for a while.
      - name: Lint, typecheck, test, build, verify repository
        shell: bash
        run: |
          # Surface the failure as a check annotation. Run logs are not always
          # retrievable, and "exit code 1" with no reason is not something anyone
          # can act on from the pull request page.
          #
          # Annotations truncate, so this emits a few targeted annotations rather
          # than one blob: the test summary always, then the failures if any line
          # is recognisable. An earlier version grepped for "FAIL " alone and
          # emitted nothing at all, which is worse than emitting too much.
          set -o pipefail
          pnpm verify 2>&1 | tee verify.log || {
            status=$?
            clean=$(sed 's/\x1b\[[0-9;]*m//g' verify.log)
            esc() { sed 's/%/%25/g' | sed 's/\r//g'; }
            echo "::error title=pnpm verify failed::$(echo "$clean" | grep -E '^ *(Test Files|Tests) ' | tail -2 | tr '\n' ' ' | esc | cut -c1-800)"
            # The last 12 lines describe the final failure even without a marker.
            echo "$clean" | grep -vE '^\s*$' | tail -12 | cut -c1-900 | while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error title=tail::$(echo "$line" | esc)"
            done
            exit $status
          }

      # SPEC 15 §6.2: the shipped notices must match what is actually installed,
      # and no dependency may have an unrecognised licence.
      - name: Third-party notices are current
        run: node scripts/release/make-notices.mjs --check

      # A build that drops the main process produces an installer for an app that
      # cannot start. Catch it here rather than in the release job.
      - name: Package contents are launchable
        run: |
          node -e "const p=require('./apps/desktop/package.json');const fs=require('fs');const m=p.main;if(!fs.existsSync('apps/desktop/'+m)){console.error('Missing main entry: '+m);process.exit(1)}console.log('main entry present: '+m)"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
