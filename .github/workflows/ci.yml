name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.x'

      - name: Enable Corepack & pnpm
        run: corepack enable

      # The lockfile is committed; installing against it is what makes "passes
      # locally" mean something in CI. Without --frozen-lockfile, CI resolves
      # versions the developer never ran, and a red build says nothing about the
      # code that was pushed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same script a developer runs locally — lint, typecheck, tests, build
      # and the repository check, in that order. Keeping one definition means CI
      # cannot drift from what was actually verified, and the build step cannot
      # be the one everybody forgets: it was, and it was broken for a while.
      - name: Lint, typecheck, test, build, verify repository
        shell: bash
        run: |
          # Surface the failure as a check annotation. Run logs are not always
          # retrievable, and "exit code 1" with no reason is not something anyone
          # can act on from the pull request page.
          #
          # The vitest JSON report is the source, not the console output: the
          # console is colourised, wrapped and truncated, and grepping it once
          # produced an empty annotation list — a failure report that reports
          # nothing is worse than none.
          set -o pipefail
          pnpm verify 2>&1 | tee verify.log || {
            status=$?
            node scripts/ci-annotate-failures.mjs .vitest-report.json || true
            exit $status
          }

      # SPEC 15 §6.2: the shipped notices must match what is actually installed,
      # and no dependency may have an unrecognised licence.
      - name: Third-party notices are current
        run: node scripts/release/make-notices.mjs --check

      # A build that drops the main process produces an installer for an app that
      # cannot start. Catch it here rather than in the release job.
      - name: Package contents are launchable
        run: |
          node -e "const p=require('./apps/desktop/package.json');const fs=require('fs');const m=p.main;if(!fs.existsSync('apps/desktop/'+m)){console.error('Missing main entry: '+m);process.exit(1)}console.log('main entry present: '+m)"

      # SPEC 15 §12.12 — no secret may appear in the repository.
      #
      # gitleaks is installed directly rather than through gitleaks-action. The
      # action builds its download URL as `.tar.gz`, but gitleaks has only ever
      # published `.zip` for Windows, so on a windows-latest runner it fails with
      # a 404 before scanning anything — and because it runs last, that failure
      # looked like a secret being found. Doing the three steps by hand keeps the
      # download visible and the version pinned in one place.
      - name: Secret scan
        shell: bash
        env:
          # Only used for the `gh release download` fallback.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pinned in the repository rather than fetched alongside the binary.
          # The release CDN (release-assets.githubusercontent.com) has returned a
          # 404, a 504 and a dropped TLS connection for these assets on three
          # separate runs. A scanner whose integrity depends on a second request
          # to the same flaky host is one request too many: the checksum is a
          # value, so it belongs in version control where a change to it shows up
          # in review.
          #
          # The digest is the one GitHub reports for the release asset
          # (`gh api repos/gitleaks/gitleaks/releases/tags/v8.30.1`).
          VERSION=8.30.1
          ASSET="gitleaks_${VERSION}_windows_x64.zip"
          EXPECTED="d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"

          echo "Downloading ${ASSET}"
          # Three sources, tried in order. `gh` takes a different route to the
          # same bytes and is authenticated, so it survives CDN wobble that
          # `curl` does not.
          obtain() {
            [ -s "$ASSET" ] && return 0
            if curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
                 --max-time 120 -o "$ASSET" "$1"; then return 0; fi
            echo "curl did not get ${ASSET}; trying gh release download"
            rm -f "$ASSET"
            if gh release download "v${VERSION}" --repo gitleaks/gitleaks \
                 --pattern "$ASSET" --clobber; then return 0; fi
            return 1
          }
          obtain "${BASE}/${ASSET}" \
            || { echo "::error::could not download ${ASSET}"; exit 1; }

          actual=$(sha256sum "$ASSET" | cut -d' ' -f1)
          if [ "$EXPECTED" != "$actual" ]; then
            echo "::error::checksum mismatch for ${ASSET}: expected ${EXPECTED}, got ${actual}"
            exit 1
          fi
          echo "Checksum verified: ${actual} ($(wc -c < "$ASSET") bytes)"

          powershell -Command "Expand-Archive -Path '$ASSET' -DestinationPath . -Force"
          ./gitleaks.exe version
          # --redact so a real finding is not printed into a public log; the file
          # and rule are still reported, which is what a fix needs.
          set +e
          # `.gitleaks.toml` allowlists exactly one path: the redaction test
          # corpus, whose strings are synthetic by construction. Everything else
          # that trips a rule is a finding.
          ./gitleaks.exe detect --source . --redact --exit-code 1 \
            --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # Name every finding. "exit code 1" cannot distinguish a leaked
            # credential from a test fixture that quotes the pattern the redactor
            # is meant to strip.
            node scripts/ci-annotate-leaks.mjs gitleaks-report.json || true
            exit "$code"
          fi

