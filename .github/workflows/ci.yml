name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # corepack reads packageManager from package.json (pnpm@9.15.9) — the same
      # pattern that the repository's other CI workflow uses successfully.
      - run: corepack enable
      - name: Install (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --fetch-retries 5 2>&1 | tee install.log || {
            code=$?
            # Logs live behind blob storage this environment cannot reach; surface
            # the failing output as a check annotation so it is readable via the API.
            tail -c 4000 install.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' | {
              read -r -d '' blob || true
              printf '::error::pnpm install failed (exit %s): %s' "$code" "$blob"
              echo
            }
            exit $code
          }
        env:
          # The Electron npm postinstall downloads ~110 MB from the release CDN,
          # which has flaked on these runners before. CI never launches Electron;
          # electron-builder fetches its own dist when packaging.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install (Windows, VS env)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "Visual Studio: $vsPath"
          cmd /c "call `"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && pnpm install --frozen-lockfile --fetch-retries 5 > install.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            $raw = [IO.File]::ReadAllText('install.log')
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($raw))
            if ($b64.Length -gt 3000) { $b64 = $b64.Substring($b64.Length - 3000) }
            Write-Host "::error::pnpm install failed (exit $LASTEXITCODE) log(base64 tail):$b64"
            exit $LASTEXITCODE
          }
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (per package, so the failing package is identifiable)
        shell: bash
        run: |
          set -o pipefail
          failed=0
          for pkg in design-system audio-core project-schema timeline-engine media-core caption-styles ai-core export-core; do
            echo "========== packages/$pkg =========="
            (cd "packages/$pkg" && pnpm test) 2>&1 | tee "test-$pkg.log" || {
              failed=1
              printf '::error::Package FAILED: %s log(base64):%s\n' "$pkg" "$(sed -e 's/\x1b\[[0-9;]*m//g' "test-$pkg.log" | tail -c 1500 | base64 -w0)"
            }
          done
          echo '========== apps/desktop =========='
          (cd apps/desktop && pnpm test) 2>&1 | tee test-desktop.log || {
            failed=1
            printf '::error::Package FAILED: apps/desktop log(base64):%s\n' "$(sed -e 's/\x1b\[[0-9;]*m//g' test-desktop.log | tail -c 1500 | base64 -w0)"
          }
          exit $failed
      - name: Build (electron-vite)
        run: pnpm --filter @clipwright/desktop build
      - name: Export matrix (Linux only; only if ffmpeg is available)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if command -v ffmpeg >/dev/null; then
            CLIPWRIGHT_FFMPEG="$(command -v ffmpeg)" node_modules/.bin/tsx scripts/verify/export-matrix.ts
          else
            echo "ffmpeg not found on runner; skipping export matrix (see docs/verification.md)"
          fi
