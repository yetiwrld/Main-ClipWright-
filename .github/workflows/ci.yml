name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.x'

      - name: Enable Corepack & pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Design token & No-fakes audit
        run: pnpm lint

      - name: Repository references resolve
        run: node scripts/check-repo.mjs

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

      # Runs *after* the tests, because it needs the JSON report they leave
      # behind: the counts quoted in docs/verification.md are compared against a
      # real run instead of being trusted.
      - name: Documented test counts match a real run
        run: node scripts/check-repo.mjs

      # SPEC 15 §6.2: the shipped notices must match what is actually installed,
      # and no dependency may have an unrecognised licence.
      - name: Third-party notices are current
        run: node scripts/release/make-notices.mjs --check

      - name: Build desktop application
        run: pnpm build

      # A build that drops the main process produces an installer for an app that
      # cannot start. Catch it here rather than in the release job.
      - name: Package contents are launchable
        run: |
          node -e "const p=require('./apps/desktop/package.json');const fs=require('fs');const m=p.main;if(!fs.existsSync('apps/desktop/'+m)){console.error('Missing main entry: '+m);process.exit(1)}console.log('main entry present: '+m)"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1f49c2b8b1c1e1b0b7d # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
